[package]
name = "shoes-test-support"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
aerobox-primitives = { path = "../../../../crates/aerobox-primitives" }
aerobox-crypto = { path = "../../../../crates/aerobox-crypto" }
base64 = "*"
bytes = "*"
futures = "*"
http-body-util = "*"
hyper = { version = "*", features = ["server", "http1", "http2"] }
hyper-util = { version = "*", features = ["tokio", "server"] }
rand = "0.10"
rcgen = { version = "*", default-features = false, features = ["rustcrypto", "pem"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12"] }
serde_json = "*"
tempfile = "*"
tokio = { version = "*", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-rustls = { version = "*", default-features = false, features = ["tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "*"
