[package]
name = "aerobox-primitives"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace]

[dependencies]
aes = "0.8.4"
aes-gcm = "0.10.3"
aes-gcm-siv = "0.11.1"
chacha20poly1305 = "0.10.1"
ctr = "0.9.2"
sha1 = "0.10.6"
sha2 = "0.10.9"
hmac = "0.12.1"
hkdf = "0.12.4"
rand_core = { version = "0.6.4", features = ["getrandom"] }
subtle = "2.6.1"
zeroize = "1.8"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8", "rand_core"] }
ml-kem = { version = "=0.3.4", features = ["zeroize"] }
ml-dsa = { path = "../../vendor/ml-dsa", features = ["zeroize"] }

[profile.dev]
debug = 1
incremental = false

[lints.rust]
unsafe_code = "forbid"

