[package]
name = "aerobox-fingerprint"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Shared process selection for AeroBox's Android random TLS fingerprint"

[dependencies]
getrandom = "=0.2.17"
sha3 = { version = "=0.11.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false }

[lints]
workspace = true

[dev-dependencies]
serde_json = "=1.0.154"
