[package]
name = "aerobox-reality-browser-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[lib]
test = false
doctest = false

[dependencies]
aerobox-crypto = { path = "../.." }
aerobox-primitives = { path = "../../../aerobox-primitives" }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "brotli"] }
parking_lot = "0.12.5"
rand = "=0.10.4"
zeroize = "1"
subtle = "2"
log = "0.4"
x509-parser = { version = "=0.18.1", default-features = false }
base64 = "0.22"

[dev-dependencies]
serde_json = "1"

[profile.dev]
debug = 0
incremental = false

[patch.crates-io]
rustls = { path = "../../../../vendor/rustls/rustls" }
