[package]
name="aerobox-tls-stream-validation"
version="0.0.0"
edition="2024"
publish=false
[workspace]
resolver="3"
[lib]
test=false
doctest=false
[dependencies]
aerobox-crypto={path="../.."}
aerobox-primitives={path="../../../aerobox-primitives"}
rustls={version="=0.23.46",default-features=false,features=["std","tls12","brotli"]}
tokio={version="1.54.1",features=["io-util","rt","net","time","macros","sync"]}
bytes="1"
futures="0.3"
log="0.4"
zeroize="1"
serde_json="1"
[profile.dev]
debug=1
incremental=false
[patch.crates-io]
rustls={path="../../../../vendor/rustls/rustls"}
