name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
      - "beta"

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      GOMOBILE_VERSION: v0.1.13
      LIBBOX_BUILD_TAGS: with_gvisor,with_quic,with_utls,with_v2ray_api,with_naive_outbound

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Prepare build logs
        run: mkdir -p build-logs

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: "9.6.1"

      - name: Set up Android SDK
        run: bash .github/scripts/setup-android-sdk.sh

      - name: Install required Android SDK packages
        run: bash .github/scripts/install-android-packages.sh

      - name: Resolve latest stable sing-box release
        run: bash .github/scripts/resolve-sing-box-version.sh

      - name: Build libbox.aar
        run: |
          set -euo pipefail
          bash .github/scripts/build-libbox.sh 2>&1 | tee build-logs/libbox.log

      - name: Prepare bundled routing rule-set assets
        run: bash .github/scripts/prepare-geo-assets.sh

      - name: Build unsigned release APK
        if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch')
        run: |
          set -euo pipefail
          gradle --stacktrace --warning-mode all :app:assembleRelease \
            2>&1 | tee build-logs/assemble-release.log

      - name: Run Android lint
        id: lint
        run: |
          set -euo pipefail
          REPORT="app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt"
          if ! gradle --stacktrace --warning-mode all :app:lintRelease \
            2>&1 | tee build-logs/lint-release.log; then
            if [ -f "${REPORT}" ]; then
              cat "${REPORT}"
            else
              echo "::warning::Android lint text report was not generated"
            fi
            exit 1
          fi

      - name: Upload Android lint report
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aerobox-ci-lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: warn

      - name: Build installable beta APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          gradle --stacktrace --warning-mode all :app:assembleBeta \
            2>&1 | tee build-logs/assemble-beta.log

      - name: Sign beta APKs (v3 only)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          SRC_DIR="${GITHUB_WORKSPACE}/app/build/outputs/apk/beta"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner"
          KEYSTORE_PATH="${RUNNER_TEMP}/beta-debug.jks"

          if [ ! -x "${APKSIGNER}" ]; then
            echo "::error::apksigner not found at ${APKSIGNER}"
            exit 1
          fi

          keytool -genkeypair \
            -keystore "${KEYSTORE_PATH}" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          shopt -s nullglob
          APKS=("${SRC_DIR}"/*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No beta APK files found in ${SRC_DIR}"
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            signed_apk="${apk%.apk}-signed.apk"
            "${APKSIGNER}" -J-enable-native-access=ALL-UNNAMED sign \
              --ks "${KEYSTORE_PATH}" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --v1-signing-enabled false \
              --v2-signing-enabled false \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              --out "${signed_apk}" \
              "${apk}"

            mv -f "${signed_apk}" "${apk}"
            "${APKSIGNER}" -J-enable-native-access=ALL-UNNAMED \
              verify --min-sdk-version 31 --verbose "${apk}"
          done

      - name: Prepare beta APKs
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          SRC_DIR="${GITHUB_WORKSPACE}/app/build/outputs/apk/beta"
          DIST_DIR="${SRC_DIR}/dist"
          mkdir -p "${DIST_DIR}"

          shopt -s nullglob
          APKS=("${SRC_DIR}"/*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No beta APK files found in ${SRC_DIR}"
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            filename="$(basename "${apk}")"
            abi="universal"
            case "${filename}" in
              *arm64-v8a*) abi="arm64-v8a" ;;
              *armeabi-v7a*) abi="armeabi-v7a" ;;
              *x86_64*) abi="x86_64" ;;
              *x86*) abi="x86" ;;
            esac
            cp -f "${apk}" "${DIST_DIR}/AeroBox-${abi}.apk"
          done

          echo "Prepared beta APK outputs:"
          ls -la "${DIST_DIR}"

      - name: Publish Beta Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(app/build/outputs/apk/beta/dist/*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APK files found for beta release upload"
            exit 1
          fi

          NOTES="此版本为测试版，可能存在不稳定情况，升级前请务必备份好数据。"
          if gh release view beta >/dev/null 2>&1; then
            gh release upload beta "${APKS[@]}" --clobber
          else
            gh release create beta "${APKS[@]}" \
              --target "${GITHUB_SHA}" \
              --title "beta" \
              --notes "${NOTES}" \
              --prerelease
          fi

      - name: Debug logs on failure
        if: failure()
        run: |
          set +e
          {
            echo "========== libbox.aar =========="
            ls -la "${GITHUB_WORKSPACE}/app/build/libbox/" || true
            echo "========== app/build/outputs =========="
            if [ -d "${GITHUB_WORKSPACE}/app/build/outputs" ]; then
              find "${GITHUB_WORKSPACE}/app/build/outputs" -maxdepth 5 -print | sort
            fi
          } 2>&1 | tee build-logs/debug.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aerobox-ci-build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-logs/*.log
          if-no-files-found: warn
          retention-days: 3
