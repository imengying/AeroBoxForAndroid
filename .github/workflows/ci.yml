name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
      - "beta"

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      GOMOBILE_VERSION: v0.1.12
      LIBBOX_BUILD_TAGS: with_gvisor,with_quic,with_utls,with_v2ray_api,with_naive_outbound

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "~1.25"
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      - name: Set up Android SDK
        run: bash .github/scripts/setup-android-sdk.sh

      - name: Install required Android SDK packages
        run: bash .github/scripts/install-android-packages.sh

      - name: Resolve latest stable sing-box release
        run: bash .github/scripts/resolve-sing-box-version.sh

      - name: Build libbox.aar
        run: bash .github/scripts/build-libbox.sh

      - name: Prepare bundled routing rule-set assets
        run: bash .github/scripts/prepare-geo-assets.sh

      - name: Build unsigned release APK
        run: |
          set -euo pipefail
          gradle --stacktrace :app:assembleRelease

      - name: Build installable beta APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          gradle --stacktrace :app:assembleBeta

      - name: Sign beta APKs (v3 only)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          SRC_DIR="${GITHUB_WORKSPACE}/app/build/outputs/apk/beta"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          KEYSTORE_PATH="${RUNNER_TEMP}/beta-debug.jks"

          if [ ! -x "${APKSIGNER}" ]; then
            echo "::error::apksigner not found at ${APKSIGNER}"
            exit 1
          fi

          keytool -genkeypair \
            -keystore "${KEYSTORE_PATH}" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          shopt -s nullglob
          APKS=("${SRC_DIR}"/*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No beta APK files found in ${SRC_DIR}"
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            signed_apk="${apk%.apk}-signed.apk"
            "${APKSIGNER}" sign \
              --ks "${KEYSTORE_PATH}" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --v1-signing-enabled false \
              --v2-signing-enabled false \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              --out "${signed_apk}" \
              "${apk}"

            mv -f "${signed_apk}" "${apk}"
            "${APKSIGNER}" verify --min-sdk-version 31 --verbose "${apk}"
          done

      - name: Prepare beta APK artifacts
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          SRC_DIR="${GITHUB_WORKSPACE}/app/build/outputs/apk/beta"
          DIST_DIR="${SRC_DIR}/dist"
          mkdir -p "${DIST_DIR}"

          shopt -s nullglob
          APKS=("${SRC_DIR}"/*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No beta APK files found in ${SRC_DIR}"
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            filename="$(basename "${apk}")"
            abi="universal"
            case "${filename}" in
              *arm64-v8a*) abi="arm64-v8a" ;;
              *armeabi-v7a*) abi="armeabi-v7a" ;;
              *x86_64*) abi="x86_64" ;;
              *x86*) abi="x86" ;;
            esac
            cp -f "${apk}" "${DIST_DIR}/AeroBox-${abi}.apk"
          done

          echo "Prepared beta APK outputs:"
          ls -la "${DIST_DIR}"

      - name: Debug logs on failure
        if: failure()
        run: |
          set +e
          echo "========== libbox.aar =========="
          ls -la "${GITHUB_WORKSPACE}/app/build/libbox/" || true
          echo "========== app/build/outputs =========="
          if [ -d "${GITHUB_WORKSPACE}/app/build/outputs" ]; then
            find "${GITHUB_WORKSPACE}/app/build/outputs" -maxdepth 5 -print | sort
          fi

      - name: Upload installable beta APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: aerobox-ci-beta-apks
          path: app/build/outputs/apk/beta/dist/*.apk
          if-no-files-found: error

  prerelease:
    needs: build-check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download beta APK artifacts
        uses: actions/download-artifact@v7
        with:
          name: aerobox-ci-beta-apks
          path: apk/

      - name: Delete Pre-Release and move beta tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view beta >/dev/null 2>&1; then
            gh release delete beta -y --cleanup-tag
          fi
          git tag -f beta "${GITHUB_SHA}"
          git push origin -f refs/tags/beta

      - name: Publish Beta Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(apk/*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APK files found for beta release upload"
            exit 1
          fi

          gh release create beta "${APKS[@]}" \
            --title "beta" \
            --notes "此版本为测试版，使用 v3-only 调试签名，并启用正式版同等压缩优化；可能存在不稳定情况，升级前请务必备份好数据。" \
            --prerelease
